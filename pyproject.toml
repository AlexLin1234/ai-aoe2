[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-aoe2-controller"
version = "0.1.0"
description = "Hybrid LLM strategist and deterministic local controller for Age of Empires II DE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mss>=10,<11", "Pillow>=11,<12", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7", "python-dotenv>=1,<2", "openai>=1.60,<2", "pywin32>=308; platform_system == 'Windows'",
]
[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5"]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[project.scripts]
astra-aoe2 = "aoe2bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe2bot"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
